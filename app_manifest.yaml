display_information:
  name: "Mrox (old)"
  description: "Monitors prox2 confessions :3"
  background_color: "#4B2D83"

features:
  slash_commands:
    - command: /mrox
      description: Track a confession by id
      usage_hint: "{id} | untrack {id}"
      should_escape: false
    - command: /dev-mrox
      description: Dev tracking command
      usage_hint: "{id}"
      should_escape: false
  bot_user:
    display_name: "Mrox (old)"
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - im:write
      - commands
      - channels:history
      - channels:read
      - channels:join
      - groups:history
      - groups:read
      - users:read
  pkce_enabled: false

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: false
