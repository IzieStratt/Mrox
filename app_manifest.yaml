display_information:
  name: "Mrox"
  description: "Monitors owl confessions :3"
  background_color: "#4B2D83"

features:
  slash_commands:
    - command: /mrox
      description: Central command for Mrox
      usage_hint: "Confession ID :D"
      should_escape: true
  bot_user:
    display_name: "Mrox"
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - im:write
      - im:history
      - commands
      - channels:history
      - channels:read
      - channels:join
      - groups:history
      - groups:read
      - users:read
  pkce_enabled: false

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - message.channels
      - message.im
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: false
